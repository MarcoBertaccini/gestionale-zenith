<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gestionale Zenith</title>
  <meta name="description" content="Gestionale interno dei prospect di Zenith Studio.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F4F6F7">

  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zenith">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/supabase-js-2.118.0.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="boot" class="boot" role="status">Caricamento…</div>

  <!-- Login -->
  <div id="login-view" class="login" hidden>
    <div class="login-card">
      <img class="login-mark" src="icons/icon.svg" alt="" width="56" height="56">
      <h1 class="login-title">Gestionale Zenith</h1>
      <p class="login-lead">Accedi con il tuo account Zenith Studio.</p>

      <form id="login-form" class="form" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" inputmode="email"
                 autocomplete="username" autocapitalize="none" spellcheck="false"
                 required aria-describedby="login-error">
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <div class="password-wrap">
            <input id="login-password" name="password" type="password"
                   autocomplete="current-password" required aria-describedby="login-error">
            <button type="button" id="toggle-password" class="password-toggle"
                    aria-controls="login-password" aria-pressed="false">Mostra</button>
          </div>
        </div>
        <p id="login-error" class="form-error" role="alert" hidden></p>
        <button type="submit" id="login-submit" class="btn btn-primary btn-block">Accedi</button>
      </form>
    </div>
  </div>

  <!-- App -->
  <div id="shell" class="shell" hidden>
    <a class="skip-link" href="#main">Vai al contenuto</a>
    <header class="topbar">
      <a class="brand" href="#/oggi">
        <img src="icons/icon.svg" alt="" width="28" height="28">
        <span>Zenith</span>
      </a>
      <div class="account">
        <span id="who" class="who"></span>
        <button type="button" id="logout" class="btn btn-quiet">Esci</button>
      </div>
    </header>

    <nav class="tabs" aria-label="Sezioni">
      <a href="#/oggi" data-nav="oggi">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" class="fill"/></svg>
        <span>Oggi</span>
      </a>
      <a href="#/lista" data-nav="lista">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1.3" class="fill"/><circle cx="4.5" cy="12" r="1.3" class="fill"/><circle cx="4.5" cy="17.5" r="1.3" class="fill"/></svg>
        <span>Prospect</span>
      </a>
    </nav>

    <main id="main" class="main" tabindex="-1"></main>
  </div>
</body>
</html>
